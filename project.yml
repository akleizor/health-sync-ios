name: HealthSync
options:
  bundleIdPrefix: de.hannessuhr
  deploymentTarget:
    iOS: "18.0"
targets:
  HealthSync:
    type: application
    platform: iOS
    sources: [HealthSync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexlee.healthsync
        INFOPLIST_FILE: HealthSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthSync/HealthSync.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${TEAM_ID}          # TEAM_ID=XXXXXXXXXX xcodegen generate
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
  HealthSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HealthSyncTests]
    dependencies:
      - target: HealthSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexlee.healthsync.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HealthSync:
    build:
      targets:
        HealthSync: all
        HealthSyncTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [HealthSyncTests]
